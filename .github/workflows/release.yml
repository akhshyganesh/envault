name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: envault-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: envault-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: envault-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: envault-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w -X github.com/akhshyganesh/envault/cmd.Version=${{ github.ref_name }} -X github.com/akhshyganesh/envault/cmd.BuildDate=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            -o dist/${{ matrix.asset_name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten dist directory
        run: |
          mkdir -p dist/flat
          find dist -mindepth 2 -type f -exec mv -t dist/flat {} +
          find dist -mindepth 1 -maxdepth 1 -type d ! -name flat -exec rm -rf {} +
          mv dist/flat/* dist/
          rmdir dist/flat

      - name: Create checksums
        run: |
          cd dist
          sha256sum envault-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/envault-linux-amd64
            dist/envault-linux-arm64
            dist/envault-darwin-amd64
            dist/envault-darwin-arm64
            dist/checksums.txt
