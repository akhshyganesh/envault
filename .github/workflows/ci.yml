name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # `make check` is fmt + vet + race tests, so this is the same gate
      # contributors run locally.
      - name: Check
        run: make check

      - name: Build
        run: make build

      - name: Shell-check the installer
        run: sh -n install.sh
