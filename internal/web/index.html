<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>envault</title>
<style>
  :root {
    --page:      #fbfbfa;
    --surface:   #f3f4f3;
    --raised:    #ffffff;
    --line:      #e3e5e4;
    --line-soft: #edefee;
    --text:      #1b1f23;
    --muted:     #6b7280;
    --faint:     #9aa1a9;

    --accent:      #2563eb;
    --accent-hov:  #1d4ed8;
    --accent-wash: #eef4ff;
    --green:       #16a34a;
    --amber:       #b45309;
    --red:         #dc2626;

    --ui:   -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --shadow-sm: 0 1px 2px rgb(16 24 40 / .06);
    --shadow-md: 0 6px 20px rgb(16 24 40 / .12);
    --shadow-lg: 0 24px 56px rgb(16 24 40 / .18);

    --head-h: 50px;
    --bar-h:  38px;
    --side:   300px;
    --radius: 7px;
    --tick:   130ms;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    grid-template-rows: var(--head-h) minmax(0, 1fr) var(--bar-h);
    height: 100dvh;
    overflow: hidden;
    background: var(--page);
    color: var(--text);
    font: 400 13px/1.45 var(--ui);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ---------- scroll panes ---------- */

  .scroll {
    overflow-y: auto;
    overscroll-behavior: contain;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: #d3d6d8 transparent;
  }
  .scroll::-webkit-scrollbar { width: 11px; height: 11px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb {
    background: #d3d6d8;
    background-clip: content-box;
    border: 3px solid transparent;
    border-radius: 99px;
  }
  .scroll::-webkit-scrollbar-thumb:hover { background: #b6bcc1; background-clip: content-box; }

  /* ---------- header ---------- */

  header {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 0 14px;
    background: var(--raised);
    border-bottom: 1px solid var(--line);
    position: relative;
    min-width: 0;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: -0.005em;
    white-space: nowrap;
    color: var(--text);
  }
  .brand svg { display: block; color: var(--accent); }
  .vault-path {
    font: 400 11.5px/1 var(--mono);
    letter-spacing: .01em;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 40ch;
  }
  .spacer { flex: 1 1 auto; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 25px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 99px;
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint);
    transition: background var(--tick) ease, box-shadow var(--tick) ease;
  }
  .status.live .dot { background: var(--green); box-shadow: 0 0 0 3px rgb(22 163 74 / .15); }

  #progress {
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 38% 100%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity var(--tick) ease;
    pointer-events: none;
  }
  #progress.on { opacity: 1; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep {
    0%   { background-position: -38% 0; }
    100% { background-position: 138% 0; }
  }

  /* ---------- buttons ---------- */

  button {
    font: inherit;
    color: var(--text);
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 11px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--tick) ease, background var(--tick) ease, color var(--tick) ease;
  }
  button:hover:not(:disabled) { border-color: #cfd3d1; background: #fcfcfc; }
  button:active:not(:disabled) { background: var(--surface); }
  button:disabled { opacity: .5; cursor: default; }

  button.accent {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
  }
  button.accent:hover:not(:disabled) { background: var(--accent-hov); border-color: var(--accent-hov); }

  button.quiet {
    background: none;
    border-color: transparent;
    box-shadow: none;
    color: var(--muted);
    padding: 4px 9px;
  }
  button.quiet:hover:not(:disabled) { background: var(--surface); border-color: transparent; color: var(--text); }
  button.quiet.on { color: var(--accent); background: var(--accent-wash); }
  button.quiet.danger:hover:not(:disabled) { color: var(--red); background: #fef2f2; }

  button.icon {
    padding: 2px 7px;
    font: 500 11px/1.5 var(--ui);
    background: none;
    border-color: transparent;
    box-shadow: none;
    color: var(--muted);
  }
  button.icon:hover:not(:disabled) { color: var(--accent); background: var(--accent-wash); border-color: transparent; }

  /* ---------- split ---------- */

  main {
    display: grid;
    grid-template-columns: var(--side) 5px minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
  }

  .resizer {
    position: relative;
    cursor: col-resize;
    background: none;
    border: 0;
    padding: 0;
    box-shadow: none;
    border-radius: 0;
    touch-action: none;
  }
  .resizer::after {
    content: "";
    position: absolute;
    inset: 0 2px;
    background: var(--line);
    transition: background var(--tick) ease;
  }
  .resizer:hover::after, .resizer:focus-visible::after, .resizer.dragging::after { background: var(--accent); }
  .resizer:focus-visible { outline: none; }
  body.resizing { cursor: col-resize; user-select: none; }

  .pane {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  .pane.files { background: var(--surface); }

  .pane-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border-bottom: 1px solid var(--line);
  }

  /* ---------- filter ---------- */

  .filter {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: 1;
    min-width: 0;
    height: 28px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--raised);
    transition: border-color var(--tick) ease, box-shadow var(--tick) ease;
  }
  .filter:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(37 99 235 / .12); }
  .filter .glass { color: var(--faint); font-size: 12px; line-height: 1; }
  .filter input {
    flex: 1; min-width: 0;
    border: 0; background: none; padding: 0;
    color: var(--text);
    font: inherit;
  }
  .filter input:focus { outline: none; }
  .filter input::placeholder { color: var(--faint); }

  kbd {
    font: 500 10.5px/1 var(--ui);
    color: var(--faint);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 2px 5px;
    background: var(--raised);
    white-space: nowrap;
  }

  /* ---------- file list ---------- */

  .list { padding: 5px 7px 14px; }

  .item {
    display: grid;
    grid-template-columns: 3px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    padding: 6px 9px 6px 0;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: none;
    box-shadow: none;
    cursor: pointer;
    transition: background var(--tick) ease;
  }
  .item:hover { background: rgb(255 255 255 / .75); border-color: transparent; }
  .item .gutter {
    align-self: stretch;
    border-radius: 99px;
    background: transparent;
    transition: background var(--tick) ease;
  }
  .item[aria-current="true"] { background: var(--accent-wash); }
  .item[aria-current="true"] .gutter { background: var(--accent); }
  .item[aria-current="true"] .name { color: var(--accent); font-weight: 500; }

  .item .body { min-width: 0; }
  .item .name {
    font: 400 12.5px/1.4 var(--mono);
    letter-spacing: .01em;
    color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .dir {
    font: 400 11px/1.35 var(--mono);
    letter-spacing: .01em;
    color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
  }
  .item .count {
    font: 400 11px/1 var(--mono);
    color: var(--faint);
    padding-right: 4px;
  }
  .item mark { background: rgb(37 99 235 / .14); color: inherit; border-radius: 3px; }
  .item .gone { color: var(--red); }

  /* ---------- detail ---------- */

  .detail-head { display: grid; gap: 9px; padding: 12px 16px 0; }

  .crumb { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .crumb .file {
    font: 500 14px/1.3 var(--mono);
    letter-spacing: .01em;
    white-space: nowrap;
  }
  .crumb .in {
    font: 400 11px/1.3 var(--mono);
    color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left; min-width: 0;
  }

  .rail {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 11px;
    scrollbar-width: thin;
    scrollbar-color: #d3d6d8 transparent;
  }
  .rail::-webkit-scrollbar { height: 8px; }
  .rail::-webkit-scrollbar-track { background: transparent; }
  .rail::-webkit-scrollbar-thumb {
    background: #d3d6d8; background-clip: content-box;
    border: 2px solid transparent; border-radius: 99px;
  }
  .chip {
    display: grid;
    gap: 1px;
    flex: none;
    padding: 4px 10px;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--raised);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: border-color var(--tick) ease, background var(--tick) ease;
  }
  .chip .v { font: 500 12px/1.2 var(--mono); color: var(--text); }
  .chip .when { font: 400 10.5px/1.25 var(--ui); color: var(--faint); }
  .chip:hover { border-color: #cfd3d1; background: var(--raised); }
  .chip[aria-current="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }
  .chip[aria-current="true"] .v,
  .chip[aria-current="true"] .when { color: #fff; }
  .chip[aria-current="true"] .when { opacity: .82; }

  .detail-tools {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-wrap: wrap;
    padding: 7px 14px;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line);
  }
  .detail-tools .sep { width: 1px; height: 17px; background: var(--line); margin: 0 6px; }
  .meta {
    font: 400 11px/1 var(--mono);
    color: var(--faint);
    margin-left: auto;
    padding-left: 10px;
    white-space: nowrap;
  }

  /* ---------- ledger ---------- */

  .ledger { padding: 4px 10px 28px; }

  .kv {
    display: grid;
    grid-template-columns: minmax(120px, 27ch) minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 14px;
    position: relative;
    padding: 7px 9px;
    border-radius: 6px;
    transition: background var(--tick) ease;
  }
  .kv:hover { background: var(--surface); }
  .kv + .kv { box-shadow: 0 -1px 0 var(--line-soft); }

  .kv .k {
    font: 500 12.5px/1.5 var(--mono);
    letter-spacing: .01em;
    color: var(--text);
    overflow-wrap: anywhere;
  }
  .kv .val {
    font: 400 12.5px/1.5 var(--mono);
    letter-spacing: .01em;
    color: var(--text);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .kv .val.masked { color: var(--faint); letter-spacing: .16em; user-select: none; }
  .kv .val.blank { color: var(--faint); font: italic 400 11.5px/1.5 var(--ui); }
  .kv .tools { display: flex; gap: 2px; opacity: 0; transition: opacity var(--tick) ease; }
  .kv:hover .tools, .kv:focus-within .tools { opacity: 1; }

  .flag {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 15px;
    border-radius: 99px;
  }
  .flag.added   { background: var(--green); }
  .flag.changed { background: var(--amber); }

  .legend {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 11px 19px 0;
    font-size: 11.5px;
    color: var(--muted);
  }
  .legend .swatch {
    display: inline-block;
    width: 3px; height: 11px;
    border-radius: 99px;
    margin-right: 7px;
    vertical-align: -1px;
  }
  .legend .swatch.added { background: var(--green); }
  .legend .swatch.changed { background: var(--amber); }

  .raw {
    margin: 0;
    padding: 14px 19px 28px;
    font: 400 12.5px/1.65 var(--mono);
    letter-spacing: .01em;
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .note {
    padding: 16px 19px 0;
    max-width: 62ch;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- empty states ---------- */

  .placeholder {
    display: grid;
    align-content: center;
    justify-items: start;
    gap: 9px;
    height: 100%;
    padding: 0 19px 40px;
    color: var(--muted);
  }
  .placeholder.top { align-content: start; height: auto; padding: 24px 12px 0; }
  .placeholder .big { font: 500 14.5px/1.4 var(--ui); color: var(--text); }
  .placeholder p { margin: 0; max-width: 44ch; font-size: 12.5px; }
  .placeholder .row { display: flex; gap: 8px; margin-top: 4px; }

  /* ---------- command bar ---------- */

  .commands {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 9px;
    background: var(--raised);
    border-top: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .commands::-webkit-scrollbar { display: none; }
  .cmd {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    flex: none;
    padding: 4px 9px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: none;
    box-shadow: none;
    color: var(--muted);
    font-size: 12px;
  }
  .cmd:hover:not(:disabled) { background: var(--surface); border-color: transparent; color: var(--text); }
  .cmd .key { font: 600 11px/1 var(--mono); color: var(--accent); }
  .commands .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; flex: none; }

  /* ---------- toasts ---------- */

  #toasts {
    position: fixed;
    right: 16px;
    bottom: calc(var(--bar-h) + 14px);
    display: grid;
    gap: 8px;
    justify-items: end;
    z-index: 30;
    pointer-events: none;
  }
  .toast {
    display: flex;
    gap: 10px;
    max-width: min(440px, calc(100vw - 32px));
    padding: 9px 13px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    pointer-events: auto;
    cursor: pointer;
    font-size: 12.5px;
    animation: rise var(--tick) ease;
  }
  .toast.bad { border-left-color: var(--red); }
  .toast .glyph { color: var(--accent); font: 600 12px/1.45 var(--mono); }
  .toast.bad .glyph { color: var(--red); }
  .toast .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  /* ---------- dialogs ---------- */

  dialog {
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--raised);
    color: var(--text);
    font: inherit;
    width: min(520px, calc(100vw - 32px));
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop { background: rgb(27 31 35 / .34); }
  dialog form { padding: 18px 20px 16px; }
  dialog h2 { margin: 0 0 5px; font-size: 15px; font-weight: 600; }
  dialog .sub { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  dialog label { display: block; margin: 13px 0 5px; font-size: 11.5px; color: var(--muted); }
  input[type=text], input[type=number], textarea {
    width: 100%;
    font: 400 13px/1.5 var(--mono);
    letter-spacing: .01em;
    color: var(--text);
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgb(37 99 235 / .12);
  }
  textarea { resize: vertical; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .keys { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; align-items: baseline; }
  .keys kbd { justify-self: start; }
  .keys .what { color: var(--muted); font-size: 12.5px; }

  /* ---------- responsive ---------- */

  @media (max-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .resizer { display: none; }
    main[data-view="list"] .pane.detail { display: none; }
    main[data-view="detail"] .pane.files { display: none; }
    .vault-path { display: none; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="2.6" y="6.9" width="10.8" height="7.5" rx="2" stroke="currentColor" stroke-width="1.4"/>
      <path d="M5.4 6.7V4.9a2.6 2.6 0 0 1 5.2 0v1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="8" cy="10.6" r="1.05" fill="currentColor"/>
    </svg>
    envault
  </span>
  <span class="vault-path" id="vaultPath"></span>
  <span class="spacer"></span>
  <span class="status" id="daemonStatus"><span class="dot"></span><span id="daemonText">checking</span></span>
  <button id="daemonToggle" class="quiet">…</button>
  <div id="progress"></div>
</header>

<main id="main" data-view="list">
  <section class="pane files">
    <div class="pane-head">
      <label class="filter" for="filterInput">
        <span class="glass">⌕</span>
        <input id="filterInput" type="text" placeholder="Filter files" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
    </div>
    <div class="scroll"><div class="list" id="fileList"></div></div>
  </section>

  <button class="resizer" id="resizer" role="separator" aria-orientation="vertical"
          aria-label="Resize the file list" title="Drag to resize · double-click to reset"></button>

  <section class="pane detail">
    <div id="detailHead"></div>
    <div class="scroll" id="detailScroll"></div>
  </section>
</main>

<nav class="commands" id="commandBar"></nav>

<div id="toasts"></div>

<dialog id="promptDialog">
  <form method="dialog">
    <h2 id="promptTitle"></h2>
    <p class="sub" id="promptSub"></p>
    <input type="text" id="promptInput" autocomplete="off" spellcheck="false">
    <div class="dialog-actions">
      <button value="cancel" type="submit">Cancel</button>
      <button value="ok" type="submit" class="accent" id="promptOk">Continue</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog">
  <form method="dialog">
    <h2>Settings</h2>
    <p class="sub">Saved to config.json in your vault.</p>
    <label for="intervalInput">Scan every (seconds)</label>
    <input type="number" id="intervalInput" min="1">
    <label for="maxVersionsInput">Versions to keep per file — 0 keeps every one</label>
    <input type="number" id="maxVersionsInput" min="0">
    <label for="watchDirsInput">Folders to watch, one per line</label>
    <textarea id="watchDirsInput" rows="4" spellcheck="false"></textarea>
    <div class="dialog-actions">
      <button value="cancel" type="submit">Cancel</button>
      <button value="ok" type="submit" class="accent">Save settings</button>
    </div>
  </form>
</dialog>

<dialog id="keysDialog">
  <form method="dialog">
    <h2>Keyboard</h2>
    <p class="sub">The same motions as the terminal UI.</p>
    <div class="keys" id="keysList"></div>
    <div class="dialog-actions"><button value="ok" type="submit" class="accent">Close</button></div>
  </form>
</dialog>

<script>
const TOKEN = "__ENVAULT_TOKEN__";
if (location.search) history.replaceState(null, "", location.pathname);

// A fixed-width mask: the number of dots must not leak a secret's length.
const MASK = "••••••••••••";

const SIDE_MIN = 210;
const SIDE_MAX = 560;
const SIDE_DEFAULT = 300;

const state = {
  files: [], config: {}, daemon: {}, vaultDir: "",
  filter: "",
  selected: null,     // position within the currently visible file list
  detail: null,       // { display, path, snapshots, version, content, prev }
  reveal: new Set(),  // individually revealed keys in the current view
  revealAll: false,
  raw: false,
  peek: null,         // { path, files } while reading an archive
  busy: 0,
};

// ---------- plumbing ----------

async function api(path, method, body) {
  const bar = document.getElementById("progress");
  state.busy++;
  bar.classList.add("on");
  try {
    const res = await fetch(path, {
      method: method || "GET",
      headers: Object.assign({ "X-Envault-Token": TOKEN },
        body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { msg = (await res.json()).error || msg; } catch (e) {}
      throw new Error(msg);
    }
    return res.json();
  } finally {
    if (--state.busy === 0) bar.classList.remove("on");
  }
}

async function run(fn) {
  try { await fn(); } catch (err) { toast(err.message, true); }
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function toast(message, bad) {
  const node = el("div", "toast" + (bad ? " bad" : ""));
  node.append(el("span", "glyph", bad ? "!" : "✓"), el("span", "text", message));
  node.onclick = () => node.remove();
  document.getElementById("toasts").appendChild(node);
  setTimeout(() => node.remove(), bad ? 9000 : 5000);
}

function ask(title, sub, value, okLabel) {
  const dlg = document.getElementById("promptDialog");
  document.getElementById("promptTitle").textContent = title;
  document.getElementById("promptSub").textContent = sub || "";
  document.getElementById("promptOk").textContent = okLabel || "Continue";
  const input = document.getElementById("promptInput");
  input.value = value || "";
  dlg.showModal();
  input.focus();
  input.select();
  return new Promise(resolve => {
    dlg.addEventListener("close", () => {
      resolve(dlg.returnValue === "ok" && input.value.trim() ? input.value.trim() : null);
    }, { once: true });
  });
}

function copy(text, what) {
  navigator.clipboard.writeText(text)
    .then(() => toast("Copied " + what))
    .catch(err => toast("Copy failed: " + err.message, true));
}

// ---------- resizable sidebar ----------

const resizer = document.getElementById("resizer");

function setSide(px) {
  const width = Math.min(SIDE_MAX, Math.max(SIDE_MIN, Math.round(px)));
  document.documentElement.style.setProperty("--side", width + "px");
  try { localStorage.setItem("envault.side", String(width)); } catch (e) {}
}

(function restoreSide() {
  try {
    const saved = Number(localStorage.getItem("envault.side"));
    if (saved) setSide(saved);
  } catch (e) {}
})();

resizer.addEventListener("pointerdown", e => {
  e.preventDefault();
  resizer.setPointerCapture(e.pointerId);
  resizer.classList.add("dragging");
  document.body.classList.add("resizing");

  const move = ev => setSide(ev.clientX - document.getElementById("main").getBoundingClientRect().left);
  const stop = () => {
    resizer.classList.remove("dragging");
    document.body.classList.remove("resizing");
    resizer.removeEventListener("pointermove", move);
    resizer.removeEventListener("pointerup", stop);
    resizer.removeEventListener("pointercancel", stop);
  };
  resizer.addEventListener("pointermove", move);
  resizer.addEventListener("pointerup", stop);
  resizer.addEventListener("pointercancel", stop);
});

resizer.addEventListener("dblclick", () => setSide(SIDE_DEFAULT));

resizer.addEventListener("keydown", e => {
  const current = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--side"), 10) || SIDE_DEFAULT;
  if (e.key === "ArrowLeft") { e.preventDefault(); setSide(current - 16); }
  else if (e.key === "ArrowRight") { e.preventDefault(); setSide(current + 16); }
  else if (e.key === "Home") { e.preventDefault(); setSide(SIDE_MIN); }
  else if (e.key === "End") { e.preventDefault(); setSide(SIDE_MAX); }
});

// ---------- .env parsing ----------

// parseEnv turns a dotenv file into ordered key/value pairs. Lines it cannot
// read — comments, blanks, exotic quoting — are counted rather than dropped
// silently, so the ledger can point at the raw view.
function parseEnv(text) {
  const pairs = [];
  let skipped = 0;
  for (const line of text.split("\n")) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith("#")) continue;
    const match = /^(?:export\s+)?([A-Za-z_][A-Za-z0-9_.]*)\s*=\s*([\s\S]*)$/.exec(trimmed);
    if (!match) { skipped++; continue; }
    let value = match[2].trim();
    const quoted = value.length > 1 &&
      ((value[0] === '"' && value.endsWith('"')) || (value[0] === "'" && value.endsWith("'")));
    if (quoted) value = value.slice(1, -1);
    pairs.push({ key: match[1], value });
  }
  return { pairs, skipped };
}

function activeFiles() {
  const list = state.peek ? state.peek.files : state.files;
  if (!state.filter) return list;
  const needle = state.filter.toLowerCase();
  return list.filter(f => f.display.toLowerCase().includes(needle));
}

function currentFile() {
  const list = activeFiles();
  return state.selected === null ? null : list[state.selected];
}

function splitPath(p) {
  const cut = p.lastIndexOf("/");
  return cut < 0 ? { dir: "", name: p } : { dir: p.slice(0, cut), name: p.slice(cut + 1) };
}

// ---------- render ----------

function renderHeader() {
  document.getElementById("vaultPath").textContent = state.vaultDir;
  const running = !!state.daemon.running;
  document.getElementById("daemonStatus").classList.toggle("live", running);
  document.getElementById("daemonText").textContent =
    running ? "Watching · pid " + state.daemon.pid : "Not watching";
  document.getElementById("daemonToggle").textContent = running ? "Stop" : "Start";
}

// highlight writes text into node, marking the part that matched the filter.
function highlight(node, text, needle) {
  if (!needle) { node.textContent = text; return; }
  const at = text.toLowerCase().indexOf(needle.toLowerCase());
  if (at < 0) { node.textContent = text; return; }
  node.append(
    document.createTextNode(text.slice(0, at)),
    el("mark", null, text.slice(at, at + needle.length)),
    document.createTextNode(text.slice(at + needle.length)),
  );
}

function renderFiles() {
  const box = document.getElementById("fileList");
  box.textContent = "";
  const list = activeFiles();

  if (state.peek) {
    const back = el("button", "quiet", "← Leave archive");
    back.style.margin = "4px 0 6px";
    back.onclick = leaveArchive;
    box.appendChild(back);
  }

  if (!list.length) {
    const empty = el("div", "placeholder top");
    if (state.filter) {
      empty.append(el("div", "big", "Nothing matches that filter"));
      empty.append(el("p", null, "Try a shorter fragment of the path."));
    } else if (state.peek) {
      empty.append(el("div", "big", "This archive has no tracked files"));
    } else {
      empty.append(el("div", "big", "No files tracked yet"));
      empty.append(el("p", null,
        "Add a folder to watch, then scan it. Anything named .env, .env.* or *.env is versioned from then on."));
      const row = el("div", "row");
      const add = el("button", "accent", "Add a folder");
      add.onclick = addWatchDir;
      row.append(add);
      empty.append(row);
    }
    box.appendChild(empty);
    return;
  }

  list.forEach((f, i) => {
    const item = el("button", "item");
    item.setAttribute("aria-current", String(state.selected === i));
    item.onclick = () => selectFile(i);
    item.append(el("span", "gutter"));

    const body = el("div", "body");
    const { dir, name } = splitPath(f.display);
    const nameEl = el("div", "name");
    highlight(nameEl, name, state.filter);
    body.append(nameEl);
    if (dir) body.append(el("div", "dir", dir));
    item.append(body);

    const count = el("span", "count", f.versions + "v");
    if (!state.peek && !f.exists) {
      const gone = el("span", "gone", " · gone");
      gone.title = "The original file is no longer on disk. Its backups are still here.";
      count.append(gone);
    }
    item.append(count);

    box.appendChild(item);
  });
}

function renderDetailHead() {
  const head = document.getElementById("detailHead");
  head.textContent = "";
  const d = state.detail;
  if (!d) return;

  const wrap = el("div", "detail-head");
  const crumb = el("div", "crumb");
  const { dir, name } = splitPath(d.display);
  crumb.append(el("span", "file", name));
  if (dir) crumb.append(el("span", "in", dir));
  wrap.append(crumb);

  const rail = el("div", "rail");
  d.snapshots.slice().reverse().forEach(s => {
    const chip = el("button", "chip");
    chip.setAttribute("aria-current", String(s.version === d.version));
    chip.append(el("span", "v", "v" + s.version), el("span", "when", s.ago));
    chip.title = s.timestamp + " · " + s.human_size + " · " + s.short_id;
    chip.onclick = () => loadVersion(s.version);
    rail.append(chip);
  });
  wrap.append(rail);
  head.appendChild(wrap);

  const tools = el("div", "detail-tools");

  const revealBtn = el("button", "quiet" + (state.revealAll ? " on" : ""),
    state.revealAll ? "Hide values" : "Reveal values");
  revealBtn.onclick = () => { state.revealAll = !state.revealAll; state.reveal.clear(); renderDetail(); };
  tools.append(revealBtn);

  const rawBtn = el("button", "quiet" + (state.raw ? " on" : ""), "Raw file");
  rawBtn.onclick = () => { state.raw = !state.raw; renderDetail(); };
  tools.append(rawBtn);

  const copyAll = el("button", "quiet", "Copy file");
  copyAll.onclick = () => copy(d.content, "v" + d.version + " of " + name);
  tools.append(copyAll);

  tools.append(el("span", "sep"));

  if (state.peek) {
    const save = el("button", "quiet", "Save a copy…");
    save.onclick = saveFromArchive;
    tools.append(save);
  } else {
    const restore = el("button", "quiet", "Restore");
    restore.onclick = restoreInPlace;
    tools.append(restore);

    const restoreTo = el("button", "quiet", "Restore to…");
    restoreTo.onclick = restoreElsewhere;
    tools.append(restoreTo);

    const forget = el("button", "quiet danger", "Stop tracking");
    forget.onclick = forgetFile;
    tools.append(forget);
  }

  const snap = d.snapshots[d.version - 1];
  tools.append(el("span", "meta", snap.timestamp + " · " + snap.human_size));
  head.appendChild(tools);
}

function renderDetailBody() {
  const scroll = document.getElementById("detailScroll");
  scroll.textContent = "";
  const d = state.detail;

  if (!d) {
    const ph = el("div", "placeholder");
    ph.append(el("div", "big", state.peek ? "Pick a file from the archive" : "Pick a file"));
    ph.append(el("p", null, state.peek
      ? "You're reading a backup zip. Nothing in here can change your vault."
      : "Its versions appear here. Values stay hidden until you reveal them."));
    scroll.appendChild(ph);
    return;
  }

  if (state.raw) {
    scroll.appendChild(el("pre", "raw", d.content));
    return;
  }

  const { pairs, skipped } = parseEnv(d.content);
  if (!pairs.length) {
    const ph = el("div", "placeholder");
    ph.append(el("div", "big", "No variables in this version"));
    ph.append(el("p", null, "Nothing here parses as KEY=value. Open the raw file to see exactly what was saved."));
    scroll.appendChild(ph);
    return;
  }

  const before = d.prev ? new Map(parseEnv(d.prev).pairs.map(p => [p.key, p.value])) : null;
  let added = 0, changed = 0;

  const ledger = el("div", "ledger");
  pairs.forEach(({ key, value }) => {
    const row = el("div", "kv");

    if (before) {
      if (!before.has(key)) {
        const flag = el("span", "flag added");
        flag.title = "Added in v" + d.version;
        row.append(flag);
        added++;
      } else if (before.get(key) !== value) {
        const flag = el("span", "flag changed");
        flag.title = "Changed in v" + d.version;
        row.append(flag);
        changed++;
      }
    }

    row.append(el("span", "k", key));

    const shown = state.revealAll || state.reveal.has(key);
    if (!value) {
      row.append(el("span", "val blank", "empty"));
    } else {
      row.append(el("span", "val" + (shown ? "" : " masked"), shown ? value : MASK));
    }

    const tools = el("span", "tools");
    if (value) {
      const eye = el("button", "icon", shown ? "Hide" : "Show");
      eye.title = shown ? "Hide this value" : "Reveal this value";
      eye.onclick = () => {
        if (state.reveal.has(key)) state.reveal.delete(key); else state.reveal.add(key);
        renderDetail();
      };
      tools.append(eye);
      const dup = el("button", "icon", "Copy");
      dup.title = "Copy this value";
      dup.onclick = () => copy(value, key);
      tools.append(dup);
    }
    row.append(tools);

    ledger.append(row);
  });

  scroll.appendChild(ledger);

  if (added || changed) {
    const legend = el("div", "legend");
    if (added) {
      const s = el("span");
      s.append(el("span", "swatch added"), document.createTextNode(added + " added since v" + (d.version - 1)));
      legend.append(s);
    }
    if (changed) {
      const s = el("span");
      s.append(el("span", "swatch changed"), document.createTextNode(changed + " changed since v" + (d.version - 1)));
      legend.append(s);
    }
    scroll.insertBefore(legend, ledger);
  }

  if (skipped) {
    scroll.appendChild(el("div", "note",
      skipped + (skipped === 1 ? " line" : " lines") +
      " didn't parse as KEY=value. Open the raw file to read them."));
  }
}

function renderDetail() {
  renderDetailHead();
  renderDetailBody();
  document.getElementById("main").dataset.view = state.detail ? "detail" : "list";
}

function render() {
  renderHeader();
  renderFiles();
  renderDetail();
}

// ---------- data ----------

async function refresh() {
  const s = await api("/api/state");
  state.files = s.files;
  state.config = s.config;
  state.daemon = s.daemon;
  state.vaultDir = s.vault_dir;
  if (!state.peek && state.selected !== null && state.selected >= activeFiles().length) {
    state.selected = null;
    state.detail = null;
  }
  render();
}

function selectFile(i) {
  state.selected = i;
  state.reveal.clear();
  renderFiles();
  loadVersion();
}

function loadVersion(version) {
  const file = currentFile();
  if (!file) return;
  return run(async () => {
    let res, snapshots;
    if (state.peek) {
      res = await api("/api/peek/content", "POST",
        { path: state.peek.path, file: file.index, version: version || 0 });
      snapshots = res.snapshots;
    } else {
      const hist = await api("/api/history?file=" + file.index);
      res = await api("/api/content?file=" + file.index + (version ? "&version=" + version : ""));
      snapshots = hist.snapshots;
    }

    // The previous version is what makes the added/changed marks possible.
    let prev = null;
    if (res.version > 1) {
      try {
        const p = state.peek
          ? await api("/api/peek/content", "POST",
              { path: state.peek.path, file: file.index, version: res.version - 1 })
          : await api("/api/content?file=" + file.index + "&version=" + (res.version - 1));
        prev = p.content;
      } catch (e) { prev = null; }
    }

    state.detail = {
      display: res.display, path: res.path, snapshots,
      version: res.version, content: res.content, prev,
    };
    state.reveal.clear();
    render();
  });
}

// ---------- actions ----------

function scanNow() {
  run(async () => {
    const res = await api("/api/scan", "POST", {});
    toast(res.backed
      ? "Scanned " + res.found + " files · " + res.backed + " new " + (res.backed === 1 ? "snapshot" : "snapshots")
      : "Scanned " + res.found + " files · nothing changed");
    await refresh();
  });
}

function toggleDaemon() {
  run(async () => {
    const res = await api("/api/daemon", "POST", { action: state.daemon.running ? "stop" : "start" });
    toast(res.running ? "Watching for changes · pid " + res.pid : "Stopped watching");
    await refresh();
  });
}

function addWatchDir() {
  run(async () => {
    const dir = await ask("Watch a folder", "envault scans it for .env files from now on.", "~/", "Watch folder");
    if (!dir) return;
    const res = await api("/api/watch", "POST", { dir });
    toast("Watching " + res.dir);
    await refresh();
  });
}

function restoreInPlace() {
  const d = state.detail;
  run(async () => {
    const path = await ask("Restore v" + d.version + " over the live file",
      "The file at this path is overwritten with this version.", d.path, "Restore");
    if (!path) return;
    const res = await api("/api/restore", "POST", { file: currentFile().index, version: d.version, path });
    toast("Restored v" + d.version + " to " + res.path);
    await refresh();
  });
}

function restoreElsewhere() {
  const d = state.detail;
  run(async () => {
    const path = await ask("Write v" + d.version + " to a new file",
      "Absolute path, or start with ~/ for your home folder.", "", "Write file");
    if (!path) return;
    const res = await api("/api/restore", "POST", { file: currentFile().index, version: d.version, path });
    toast("Wrote " + res.path);
  });
}

function forgetFile() {
  const d = state.detail;
  const file = currentFile();
  const { name } = splitPath(d.display);
  run(async () => {
    const typed = await ask("Stop tracking this file",
      "Deletes every stored version. The file on disk is left alone. Type " + name + " to confirm.",
      "", "Stop tracking");
    if (!typed) return;
    if (typed !== name && typed !== d.display) {
      toast("Left it alone — that didn't match " + name, true);
      return;
    }
    await api("/api/forget", "POST", { file: file.index });
    state.selected = null;
    state.detail = null;
    toast("Stopped tracking " + name + ". Reclaim space to free the disk.");
    await refresh();
  });
}

function reclaim() {
  run(async () => {
    const res = await api("/api/gc", "POST", {});
    toast(res.removed
      ? "Freed " + res.human_freed + " from " + res.removed + " unused " + (res.removed === 1 ? "blob" : "blobs")
      : "Nothing to reclaim");
    await refresh();
  });
}

function exportVault() {
  run(async () => {
    const res = await fetch("/api/export", { headers: { "X-Envault-Token": TOKEN } });
    if (!res.ok) throw new Error("Export failed: " + res.status + " " + res.statusText);
    const match = (res.headers.get("Content-Disposition") || "").match(/filename="?([^"]+)"?/);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = match ? match[1] : "envault-backup.zip";
    a.click();
    URL.revokeObjectURL(url);
    toast("Downloaded " + a.download);
  });
}

function importVault() {
  run(async () => {
    const path = await ask("Import a backup zip",
      "Replaces the vault on this machine with the archive's contents.", "", "Import");
    if (!path) return;
    const force = confirm("Overwrite the vault at " + state.vaultDir + "?\n\nOK replaces it. Cancel imports only if the vault is empty.");
    const res = await api("/api/import", "POST", { path, force });
    toast("Imported " + res.files + " files");
    await refresh();
  });
}

function peekArchive() {
  run(async () => {
    const path = await ask("Read a backup zip",
      "Opens the archive read-only. Your vault is never touched.", "", "Open archive");
    if (!path) return;
    const res = await api("/api/peek", "POST", { path });
    state.peek = { path, files: res.files };
    state.selected = null;
    state.detail = null;
    state.filter = "";
    document.getElementById("filterInput").value = "";
    render();
    toast("Reading " + path);
  });
}

function leaveArchive() {
  state.peek = null;
  state.selected = null;
  state.detail = null;
  render();
}

function saveFromArchive() {
  const d = state.detail;
  run(async () => {
    const out = await ask("Save v" + d.version + " out of the archive",
      "Absolute path, or start with ~/ for your home folder.", "", "Save file");
    if (!out) return;
    const res = await api("/api/peek/save", "POST",
      { path: state.peek.path, file: currentFile().index, version: d.version, out });
    toast("Saved " + res.out + " · your vault is unchanged");
  });
}

function openSettings() {
  document.getElementById("intervalInput").value = state.config.scan_interval_secs;
  document.getElementById("maxVersionsInput").value = state.config.max_versions;
  document.getElementById("watchDirsInput").value = (state.config.watch_dirs || []).join("\n");
  document.getElementById("settingsDialog").showModal();
}

document.getElementById("settingsDialog").addEventListener("close", function () {
  if (this.returnValue !== "ok") return;
  run(async () => {
    await api("/api/config", "POST", {
      scan_interval_secs: Number(document.getElementById("intervalInput").value),
      max_versions: Number(document.getElementById("maxVersionsInput").value),
      watch_dirs: document.getElementById("watchDirsInput").value
        .split("\n").map(s => s.trim()).filter(Boolean),
    });
    toast("Settings saved. Restart watching to pick up the new interval.");
    await refresh();
  });
});

// ---------- command bar ----------

const COMMANDS = [
  { key: "s", label: "Scan",     run: scanNow },
  { key: "w", label: "Watch",    run: addWatchDir },
  { key: "e", label: "Export",   run: exportVault },
  { key: "i", label: "Import",   run: importVault },
  { key: "p", label: "Read zip", run: peekArchive },
  { key: "x", label: "Reclaim",  run: reclaim },
  { key: ",", label: "Settings", run: openSettings },
];

const SHORTCUTS = [
  ["j / ↓", "Next file"],
  ["k / ↑", "Previous file"],
  ["g / G", "First / last file"],
  ["Esc", "Back to the file list"],
  ["/", "Filter files"],
  ["r", "Reveal or hide values"],
  ["t", "Raw file"],
  ["c", "Copy this version"],
  ["1…9", "Jump to a version"],
  ["s w e i p x ,", "The commands along the bottom"],
];

function renderCommands() {
  const bar = document.getElementById("commandBar");
  bar.textContent = "";
  COMMANDS.forEach(c => {
    const b = el("button", "cmd");
    b.append(el("span", "key", c.key), el("span", null, c.label));
    b.onclick = c.run;
    bar.append(b);
  });
  bar.append(el("span", "sep"));
  const help = el("button", "cmd");
  help.append(el("span", "key", "?"), el("span", null, "Keyboard"));

  bar.append(help);
}

function openKeys() {
  const box = document.getElementById("keysList");

  document.getElementById("keysDialog").showModal();
}

// ---------- keyboard ----------

document.addEventListener("keydown", e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") {
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  if (document.querySelector("dialog[open]")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement === resizer &&
      ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;

  const list = activeFiles();

  switch (e.key) {
    case "/":
      e.preventDefault();
      document.getElementById("filterInput").focus();
      return;
    case "j": case "ArrowDown":
      if (!list.length) return;
      e.preventDefault();
      selectFile(state.selected === null ? 0 : Math.min(state.selected + 1, list.length - 1));
      return;
    case "k": case "ArrowUp":
      if (!list.length) return;
      e.preventDefault();
      selectFile(state.selected === null ? 0 : Math.max(state.selected - 1, 0));
      return;
    case "g":
      if (list.length) selectFile(0);
      return;
    case "G":
      if (list.length) selectFile(list.length - 1);
      return;
    case "Escape":
      if (state.detail) { state.detail = null; state.selected = null; render(); }
      else if (state.peek) leaveArchive();
      return;
    case "r":
      if (state.detail) { state.revealAll = !state.revealAll; state.reveal.clear(); renderDetail(); }
      return;
    case "t":
      if (state.detail) { state.raw = !state.raw; renderDetail(); }
      return;
    case "c":
      if (state.detail) copy(state.detail.content, "v" + state.detail.version);
      return;
    case "?":
      openKeys();
      return;
  }

  if (state.detail && e.key >= "1" && e.key <= "9") {
    const v = Number(e.key);
    if (v <= state.detail.snapshots.length) loadVersion(v);
    return;
  }

  const cmd = COMMANDS.find(c => c.key === e.key);
  if (cmd) { e.preventDefault(); cmd.run(); }
});

// ---------- wiring ----------

document.getElementById("filterInput").addEventListener("input", e => {
  state.filter = e.target.value.trim();
  state.selected = null;
  state.detail = null;
  render();
});

document.getElementById("daemonToggle").onclick = toggleDaemon;

renderCommands();
run(refresh);
</script>
</body>
</html>
